services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./templates:/app/templates
      - ./field-maps:/app/field-maps
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
      # Multi-env settings: config.py reads these as FILES per selected env
      # (not just OS env vars), so bind-mount rather than use env_file. Create
      # them from the .example templates before `docker compose up`.
      - ./backend/.env.shared:/app/.env.shared:ro
      - ./backend/.env.dev:/app/.env.dev:ro
      - ./backend/.env.stg:/app/.env.stg:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5144:5144"
    environment:
      VITE_API_URL: http://localhost:8001
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/package.json:/app/package.json:ro
    depends_on:
      backend:
        condition: service_healthy
